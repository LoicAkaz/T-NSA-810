name: Mirror repository

on:
  push:
    branches:
      - main

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Git identity
        run: |
          git config --global user.name "Wilfried Djoum"
          git config --global user.email "wilfrieddjoum@gmail.com"

      - name: Add school remote
        run: |
          git remote add school https://x-access-token:${{ secrets.SCHOOL_TOKEN }}@github.com/EpitechMscProPromo2027/T-NSA-810-PAR_19.git

      - name: Push main branch only
        run: |
          git push school main --force