---
# =============================================================================
# group_vars/all/monitoring.yml
# Variables de monitoring communes à tous les hosts
# Les secrets sont dans vault.yml
# =============================================================================

# --- Versions (source unique de vérité) ---
prometheus_version: "2.52.0"
alertmanager_version: "0.27.0"
loki_version: "3.0.0"
grafana_version: "11.0.0"
node_exporter_version: "1.8.1"
promtail_version: "3.0.0"

# --- Adresse Loki pour tous les agents Promtail ---
# "monitoring.lan" doit être résolvable depuis tous les hosts (DNS interne ou /etc/hosts)
loki_push_url: "http://monitoring.lan:3100/loki/api/v1/push"

# --- Prometheus targets ---
# Ajouter ici tout nouveau host à monitorer
prometheus_node_exporter_targets:
  - "bastion.lan:9100"
  - "applicatif.lan:9100"
  - "netbox.lan:9100"
  - "monitoring.lan:9100"

# --- Alertmanager receivers ---
# Les credentials sont dans vault.yml (vault_alertmanager_*)
alertmanager_email_enabled: true
alertmanager_email_from: "alertmanager@example.com"
alertmanager_email_to: "ops@example.com"
alertmanager_email_smarthost: "smtp.example.com:587"
alertmanager_email_auth_username: "{{ vault_alertmanager_email_username }}"
alertmanager_email_auth_password: "{{ vault_alertmanager_email_password }}"

alertmanager_slack_enabled: true
alertmanager_slack_webhook_url: "{{ vault_alertmanager_slack_webhook_url }}"
alertmanager_slack_channel: "#alerts-infra"

# --- Labels Promtail communs (optionnel) ---
promtail_extra_labels:
  env: "production"

# Tiers de dashboards à déployer.
grafana_dashboard_tiers:
  - tier1
  - tier2
  - logs

# =============================================================================
# ---- AJOUT CIA : dashboards Tier 1/2, blackbox & postgres_exporter ----
# =============================================================================

# --- Versions des nouveaux exporters ---
blackbox_version: "0.25.0"
postgres_exporter_version: "0.15.0"

# --- blackbox_exporter (tourne sur observability) ---
blackbox_address: "127.0.0.1:9115"           # utilisé dans le relabel Prometheus
blackbox_dns_query_name: "host.interne.cia.lan"   # zone interne réelle à tester

# Cibles des sondes — REMPLACER par tes vraies IP/URL :
blackbox_icmp_targets:            # latence inter-site : passerelle LAN du site distant
  - "10.20.0.1"
blackbox_http_internal_targets:   # site web interne (sondé depuis le LAN)
  - "http://site.interne.cia.lan"
blackbox_http_netbox_targets:     # IHM/API NetBox
  - "http://netbox.lan:8000/login/"
blackbox_dns_targets:             # résolveurs des 2 sites (port 53)
  - "10.10.0.2:53"
  - "10.20.0.2:53"

# --- postgres_exporter (tourne sur l'hôte BDD / NetBox) ---
postgres_exporter_targets:
  - "netbox.lan:9187"
# DSN lecture seule vers la base netbox.
# Le mot de passe doit venir de vault.yml (vault_pg_exporter_password), pas en clair.
postgres_exporter_dsn: "postgresql://exporter:{{ vault_pg_exporter_password }}@localhost:5432/netbox?sslmode=disable"