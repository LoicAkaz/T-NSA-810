---
# Variables shared by all hosts

# ⚠️  À modifier : URL de ton dépôt Git contenant ce projet Ansible
ansible_pull_repo: "https://github.com/LoicAkaz/T-NSA-810.git"
ansible_pull_branch: "main"
ansible_pull_playbook: "local.yml"

# Fréquence de synchronisation (format cron)
# "*/10 * * * *" = toutes les 10 minutes
ansible_pull_cron_schedule: "*/10 * * * *"

welcome_message: "Hello from Ansible Pull! This server manages itself 🚀"
server_owner: "Akaz"
