---
# =============================================================================
# group_vars/all/vault.yml (EXTRAIT — à merger avec le vault existant)
# Chiffrer avec : ansible-vault encrypt group_vars/all/vault.yml
# =============================================================================
# À ajouter au vault existant :

# vault_alertmanager_email_username: "your-smtp-user"
# vault_alertmanager_email_password: "your-smtp-password"
# Discord : URL du webhook Discord avec "/slack" ajouté à la fin
# (Alertmanager utilise l'intégration Slack, l'endpoint /slack de Discord est compatible)
# vault_alertmanager_slack_webhook_url: "https://discord.com/api/webhooks/<id>/<token>/slack"
# vault_grafana_admin_password: "your-grafana-admin-password"
