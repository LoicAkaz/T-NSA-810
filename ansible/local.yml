---
# local.yml — Main entry point playbook
# Run with: ansible-playbook local.yml

- name: "Configure servers"
  hosts: all
  gather_facts: true
  become: true
  force_handlers: true

  roles:
    - vault_ssh_ca

    - role: system_baseline

    - role: ssh_users

    - role: ssh_hardening

    - role: host_firewall

    # Agent metrics - tous les serveurs
    - role: node_exporter
      tags: [monitoring, node_exporter]

    # Agent logs - tous les serveurs
    - role: promtail
      tags: [monitoring, promtail]

    # PostgreSQL exporter - activé explicitement par hôte
    - role: postgres_exporter
      when: postgres_exporter_enabled | default(false)
      tags: [monitoring, postgres_exporter]

    # Stack centrale - uniquement le serveur observability
    - role: monitoring_stack
      when: "'cap_monitoring_central' in group_names"
      tags: [monitoring, monitoring_stack]
