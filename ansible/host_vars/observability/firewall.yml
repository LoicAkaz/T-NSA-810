---

host_firewall_ssh_port: 22
host_firewall_logging: "on"
host_firewall_in_rules:
  - port: 80
    proto: tcp
    comment: "Allow HTTP traffic"
  - port: 443
    proto: tcp
    comment: "Allow HTTPS traffic"
  - port: "9100"
    proto: tcp
    from_ip: "{{ hostvars['observability']['host_ip'] }}"
    comment: "Prometheus scrape node_exporter"
  - port: "3100"
    proto: tcp
    from_ip: "{{ hostvars['bastion']['host_ip'] }}"
    comment: "Promtail push — bastion"
  - port: "3100"
    proto: tcp
    from_ip: "{{ hostvars['applicatif']['host_ip'] }}"
    comment: "Promtail push — applicatif"
  - port: "3100"
    proto: tcp
    from_ip: "{{ hostvars['netbox']['host_ip'] }}"
    comment: "Promtail push — netbox"
  - port: "3100"
    proto: tcp
    from_ip: "{{ hostvars['preprod']['host_ip'] }}"
    comment: "Promtail push — preprod"

  # Stack centrale (accès depuis ton réseau d'admin uniquement)
  - port: "3000"
    proto: tcp
    from_ip: "{{ admin_network_cidr }}"
    comment: "Grafana UI"
  - port: "9090"
    proto: tcp
    from_ip: "{{ admin_network_cidr }}"
    comment: "Prometheus UI"
  - port: "9093"
    proto: tcp
    from_ip: "{{ admin_network_cidr }}"
    comment: "Alertmanager UI"

ssh_allow_tcp_forwarding: "yes"
