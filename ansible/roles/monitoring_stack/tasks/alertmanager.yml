---
# =============================================================================
# monitoring_stack — tasks/alertmanager.yml
# =============================================================================

- name: "alertmanager | create system user"
  ansible.builtin.user:
    name: "{{ alertmanager_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: "alertmanager | create directories"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ alertmanager_user }}"
    group: "{{ alertmanager_user }}"
    mode: "0755"
  loop:
    - "{{ alertmanager_config_dir }}"
    - "{{ alertmanager_data_dir }}"

- name: "alertmanager | check installed version"
  ansible.builtin.command: /usr/local/bin/alertmanager --version
  register: alertmanager_installed_version
  changed_when: false
  failed_when: false

- name: "alertmanager | download binary"
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/alertmanager/releases/download/v{{ alertmanager_version }}/alertmanager-{{ alertmanager_version }}.linux-amd64.tar.gz"
    dest: "/tmp/alertmanager-{{ alertmanager_version }}.tar.gz"
    mode: "0644"
  when: >
    alertmanager_installed_version.rc != 0 or
    alertmanager_version not in alertmanager_installed_version.stderr

- name: "alertmanager | extract binary"
  ansible.builtin.unarchive:
    src: "/tmp/alertmanager-{{ alertmanager_version }}.tar.gz"
    dest: /tmp
    remote_src: true
  when: >
    alertmanager_installed_version.rc != 0 or
    alertmanager_version not in alertmanager_installed_version.stderr

- name: "alertmanager | install binaries"
  ansible.builtin.copy:
    src: "/tmp/alertmanager-{{ alertmanager_version }}.linux-amd64/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  loop:
    - alertmanager
    - amtool
  notify: restart alertmanager
  when: >
    alertmanager_installed_version.rc != 0 or
    alertmanager_version not in alertmanager_installed_version.stderr

- name: "alertmanager | deploy config"
  ansible.builtin.template:
    src: alertmanager.yml.j2
    dest: "{{ alertmanager_config_dir }}/alertmanager.yml"
    owner: "{{ alertmanager_user }}"
    group: "{{ alertmanager_user }}"
    mode: "0640"
  notify: restart alertmanager

- name: "alertmanager | deploy systemd unit"
  ansible.builtin.template:
    src: alertmanager.service.j2
    dest: /etc/systemd/system/alertmanager.service
    owner: root
    group: root
    mode: "0644"
  notify: restart alertmanager

- name: "alertmanager | ensure service is started and enabled"
  ansible.builtin.systemd:
    name: alertmanager
    state: started
    enabled: true
    daemon_reload: true
