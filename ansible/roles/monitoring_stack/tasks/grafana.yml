---
# =============================================================================
# monitoring_stack — tasks/grafana.yml
# Installation via le dépôt APT officiel Grafana
# =============================================================================

- name: "grafana | install dependencies"
  ansible.builtin.package:
    name:
      - apt-transport-https
      - software-properties-common
      - gnupg
    state: present

- name: "grafana | add GPG key"
  ansible.builtin.get_url:
    url: https://apt.grafana.com/gpg.key
    dest: /etc/apt/keyrings/grafana.asc
    mode: "0644"

- name: "grafana | clean up old gpg key"
  ansible.builtin.file:
    path: /etc/apt/keyrings/grafana.gpg
    state: absent

- name: "grafana | clean up old apt repository config"
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/grafana.list
    state: absent

- name: "grafana | add apt repository"
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/grafana.asc] https://apt.grafana.com stable main"
    state: present
    filename: grafana
    update_cache: true

- name: "grafana | install package"
  ansible.builtin.package:
    name: "grafana={{ grafana_version }}"
    state: present
  notify: restart grafana

- name: "grafana | deploy grafana.ini"
  ansible.builtin.template:
    src: grafana.ini.j2
    dest: /etc/grafana/grafana.ini
    owner: "{{ grafana_user }}"
    group: "{{ grafana_user }}"
    mode: "0640"
  notify: restart grafana

- name: "grafana | deploy provisioning — datasources"
  ansible.builtin.template:
    src: grafana_datasources.yml.j2
    dest: /etc/grafana/provisioning/datasources/monitoring.yml
    owner: "{{ grafana_user }}"
    group: "{{ grafana_user }}"
    mode: "0640"
  notify: restart grafana

- name: "grafana | ensure service is started and enabled"
  ansible.builtin.systemd:
    name: grafana-server
    state: started
    enabled: true

- name: Reset Grafana admin password
  command: grafana-cli admin reset-admin-password "{{ vault_grafana_admin_password }}"
  become: true
  notify: restart grafana
