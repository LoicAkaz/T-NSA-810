---
# =============================================================================
# monitoring_stack — tasks/prometheus.yml
# =============================================================================

- name: "prometheus | create system user"
  ansible.builtin.user:
    name: "{{ prometheus_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: "prometheus | create directories"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_user }}"
    mode: "0755"
  loop:
    - "{{ prometheus_config_dir }}"
    - "{{ prometheus_config_dir }}/rules"
    - "{{ prometheus_data_dir }}"

- name: "prometheus | check installed version"
  ansible.builtin.command: /usr/local/bin/prometheus --version
  register: prometheus_installed_version
  changed_when: false
  failed_when: false

- name: "prometheus | download binary"
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/prometheus/releases/download/v{{ prometheus_version }}/prometheus-{{ prometheus_version }}.linux-amd64.tar.gz"
    dest: "/tmp/prometheus-{{ prometheus_version }}.tar.gz"
    mode: "0644"
  when: >
    prometheus_installed_version.rc != 0 or
    prometheus_version not in prometheus_installed_version.stderr

- name: "prometheus | extract binary"
  ansible.builtin.unarchive:
    src: "/tmp/prometheus-{{ prometheus_version }}.tar.gz"
    dest: /tmp
    remote_src: true
  when: >
    prometheus_installed_version.rc != 0 or
    prometheus_version not in prometheus_installed_version.stderr

- name: "prometheus | install binaries"
  ansible.builtin.copy:
    src: "/tmp/prometheus-{{ prometheus_version }}.linux-amd64/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  loop:
    - prometheus
    - promtool
  notify: restart prometheus
  when: >
    prometheus_installed_version.rc != 0 or
    prometheus_version not in prometheus_installed_version.stderr

- name: "prometheus | deploy prometheus.yml config"
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ prometheus_config_dir }}/prometheus.yml"
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_user }}"
    mode: "0644"
    validate: "/usr/local/bin/promtool check config %s"
  notify: reload prometheus

- name: "prometheus | deploy alert rules"
  ansible.builtin.template:
    src: alert_rules.yml.j2
    dest: "{{ prometheus_config_dir }}/rules/alert_rules.yml"
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_user }}"
    mode: "0644"
  notify: reload prometheus

- name: "prometheus | deploy systemd unit"
  ansible.builtin.template:
    src: prometheus.service.j2
    dest: /etc/systemd/system/prometheus.service
    owner: root
    group: root
    mode: "0644"
  notify: restart prometheus

- name: "prometheus | ensure service is started and enabled"
  ansible.builtin.systemd:
    name: prometheus
    state: started
    enabled: true
    daemon_reload: true
