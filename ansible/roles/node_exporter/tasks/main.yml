---
# =============================================================================
# node_exporter — tasks/main.yml
# =============================================================================

- name: "node_exporter | create system user"
  ansible.builtin.user:
    name: "{{ node_exporter_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: "node_exporter | create textfile collector directory"
  ansible.builtin.file:
    path: "{{ node_exporter_textfile_dir }}"
    state: directory
    owner: "{{ node_exporter_user }}"
    group: "{{ node_exporter_user }}"
    mode: "0755"

- name: "node_exporter | check installed version"
  ansible.builtin.command: /usr/local/bin/node_exporter --version
  register: node_exporter_installed_version
  changed_when: false
  failed_when: false

- name: "node_exporter | download binary"
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
    dest: "/tmp/node_exporter-{{ node_exporter_version }}.tar.gz"
    mode: "0644"
  when: >
    node_exporter_installed_version.rc != 0 or
    node_exporter_version not in node_exporter_installed_version.stderr

- name: "node_exporter | extract binary"
  ansible.builtin.unarchive:
    src: "/tmp/node_exporter-{{ node_exporter_version }}.tar.gz"
    dest: /tmp
    remote_src: true
  when: >
    node_exporter_installed_version.rc != 0 or
    node_exporter_version not in node_exporter_installed_version.stderr

- name: "node_exporter | install binary"
  ansible.builtin.copy:
    src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
    dest: /usr/local/bin/node_exporter
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  notify: restart node_exporter
  when: >
    node_exporter_installed_version.rc != 0 or
    node_exporter_version not in node_exporter_installed_version.stderr

- name: "node_exporter | deploy systemd unit"
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: restart node_exporter

- name: "node_exporter | ensure service is started and enabled"
  ansible.builtin.systemd:
    name: node_exporter
    state: started
    enabled: true
    daemon_reload: true
