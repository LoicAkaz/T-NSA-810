---
# roles/bootstrap/tasks/main.yml

- name: Créer un fichier de bienvenue
  ansible.builtin.copy:
    content: |
      ============================================
       {{ welcome_message }}
      --------------------------------------------
       Owner   : {{ server_owner }}
       Host    : {{ inventory_hostname }}
      ============================================
    dest: /home/{{ ansible_user | default('ubuntu') }}/welcome2.txt
    owner: root
    group: root
    mode: '0644'