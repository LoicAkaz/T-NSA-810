---
# =============================================================================
# promtail — tasks/main.yml
# =============================================================================

- name: "promtail | create system user (adm group pour lire les logs)"
  ansible.builtin.user:
    name: "{{ promtail_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    groups: adm
    append: true

- name: "promtail | create directories"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ promtail_user }}"
    group: "{{ promtail_user }}"
    mode: "0755"
  loop:
    - "{{ promtail_config_dir }}"
    - "{{ promtail_positions_dir }}"

- name: "promtail | check installed version"
  ansible.builtin.command: /usr/local/bin/promtail --version
  register: promtail_installed_version
  changed_when: false
  failed_when: false

- name: "promtail | install unzip"
  ansible.builtin.package:
    name: unzip
    state: present
  when: >
    promtail_installed_version.rc != 0 or
    promtail_version not in promtail_installed_version.stderr

- name: "promtail | download binary"
  ansible.builtin.get_url:
    url: "https://github.com/grafana/loki/releases/download/v{{ promtail_version }}/promtail-linux-amd64.zip"
    dest: "/tmp/promtail-{{ promtail_version }}.zip"
    mode: "0644"
  when: >
    promtail_installed_version.rc != 0 or
    promtail_version not in promtail_installed_version.stderr

- name: "promtail | extract binary"
  ansible.builtin.unarchive:
    src: "/tmp/promtail-{{ promtail_version }}.zip"
    dest: /tmp
    remote_src: true
  when: >
    promtail_installed_version.rc != 0 or
    promtail_version not in promtail_installed_version.stderr

- name: "promtail | install binary"
  ansible.builtin.copy:
    src: /tmp/promtail-linux-amd64
    dest: /usr/local/bin/promtail
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  notify: restart promtail
  when: >
    promtail_installed_version.rc != 0 or
    promtail_version not in promtail_installed_version.stderr

- name: "promtail | deploy config"
  ansible.builtin.template:
    src: promtail.yml.j2
    dest: "{{ promtail_config_dir }}/promtail.yml"
    owner: "{{ promtail_user }}"
    group: "{{ promtail_user }}"
    mode: "0640"
  notify: restart promtail

- name: "promtail | deploy systemd unit"
  ansible.builtin.template:
    src: promtail.service.j2
    dest: /etc/systemd/system/promtail.service
    owner: root
    group: root
    mode: "0644"
  notify: restart promtail

- name: "promtail | ensure service is started and enabled"
  ansible.builtin.systemd:
    name: promtail
    state: started
    enabled: true
    daemon_reload: true

# --- Lecture du log ansible-pull par promtail (membre du groupe adm) ---
# Self-healing des hosts bootstrappés avant le passage de root:root → root:adm.
- name: "promtail | stat du log ansible-pull"
  ansible.builtin.stat:
    path: "{{ promtail_ansible_pull_log }}"
  register: promtail_ansible_pull_logfile

- name: "promtail | log ansible-pull lisible par le groupe adm"
  ansible.builtin.file:
    path: "{{ promtail_ansible_pull_log }}"
    group: adm
    mode: "0640"
  when: promtail_ansible_pull_logfile.stat.exists

- name: "promtail | stat du logrotate ansible-pull"
  ansible.builtin.stat:
    path: /etc/logrotate.d/ansible-pull
  register: promtail_ansible_pull_logrotate

- name: "promtail | corriger la directive create du logrotate ansible-pull"
  ansible.builtin.replace:
    path: /etc/logrotate.d/ansible-pull
    regexp: '^(\s*create\s+\d+\s+root\s+)root\s*$'
    replace: '\g<1>adm'
  when: promtail_ansible_pull_logrotate.stat.exists
