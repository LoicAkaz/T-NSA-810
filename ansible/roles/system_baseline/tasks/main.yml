- name: Install base packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 120
  register: baseline_apt_install
  until: baseline_apt_install is succeeded
  retries: 4
  delay: 20

- name: Set timezone
  ansible.builtin.file:
    src: /usr/share/zoneinfo/{{ timezone }}
    dest: /etc/localtime
    state: link
    force: true

- name: Enable and start chrony (NTP)
  ansible.builtin.service:
    name: chrony
    state: started
    enabled: true

